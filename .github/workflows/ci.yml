name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Only production deps can actually be exploited: the Worker bundle is
      # hono plus this repo's own code. wrangler and vitest drag in a standing
      # pile of advisories that would keep this permanently red while changing
      # nothing about what ships. The prod tree is one package, so this fails
      # on any severity rather than picking a threshold.
      - run: npm audit --omit=dev
